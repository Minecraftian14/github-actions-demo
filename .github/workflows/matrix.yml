name: Matrix Configuration

on:
  push:

jobs:
  run-tests:
    strategy:
      matrix:
        node: [20, 22]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Clean Install
        run: npm ci

      - name: Run Tests
        run: npm test -- --run
